<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Mini Clawd</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div id="bubble">
    <p id="empty" hidden>That session has ended.</p>
    <section id="content" hidden>
      <header>
        <div id="name">n/a</div>
        <span id="state" class="pill"></span>
      </header>
      <div class="grid">
        <div><h2>Model</h2><div class="big" id="model">n/a</div></div>
        <div><h2>Turns</h2><div class="big" id="turns">n/a</div></div>
        <div><h2>Uptime</h2><div class="big" id="uptime">n/a</div></div>
      </div>
      <h2>Context <span id="ctx-label"></span></h2>
      <div class="meter"><div id="ctx-bar"></div></div>
      <h2>Tokens</h2>
      <table>
        <tr><td>Input</td><td id="t-input">n/a</td></tr>
        <tr><td>Output</td><td id="t-output">n/a</td></tr>
        <tr><td>Cache read</td><td id="t-cread">n/a</td></tr>
        <tr><td>Cache write</td><td id="t-cwrite">n/a</td></tr>
      </table>
      <p class="muted" id="cwd"></p>
    </section>
    <div id="tail"></div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
