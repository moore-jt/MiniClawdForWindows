<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="strip"></div>

  <!-- One clawd: original 10x5 pixel art, scaled up with crisp edges. -->
  <template id="clawd-template">
    <svg class="clawd" viewBox="0 0 10 5" width="40" height="20" shape-rendering="crispEdges">
      <g fill="#d9774f">
        <rect x="2" y="0" width="6" height="1"/>
        <rect x="1" y="1" width="8" height="1"/>
        <rect x="0" y="2" width="10" height="1"/>
        <rect x="1" y="3" width="8" height="1"/>
        <rect x="2" y="4" width="2" height="1"/>
        <rect x="7" y="4" width="2" height="1"/>
      </g>
      <g fill="#2b1d16">
        <rect x="2" y="1" width="1" height="1"/>
        <rect x="6" y="1" width="1" height="1"/>
      </g>
    </svg>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
