<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="strip"></div>

  <!--
    One clawd: original 12x9 pixel art, scaled 4x with crisp edges. Parts are separate
    groups so CSS can animate them per state (see style.css).
    Rows:  0-3 speech bubble area (top right) | 4-7 body | 8 feet
  -->
  <template id="clawd-template">
    <div class="clawd">
      <svg class="sprite" viewBox="0 0 12 9" width="48" height="36" shape-rendering="crispEdges">
        <!-- "!" bubble (needs you) -->
        <g class="bubble bubble-alert" fill="#e5484d">
          <rect x="10" y="0" width="1" height="2"/>
          <rect x="10" y="3" width="1" height="1"/>
        </g>
        <!-- check mark (done) -->
        <g class="bubble bubble-done" fill="#30a46c">
          <rect x="8" y="2" width="1" height="1"/>
          <rect x="9" y="3" width="1" height="1"/>
          <rect x="10" y="2" width="1" height="1"/>
          <rect x="11" y="1" width="1" height="1"/>
        </g>
        <g class="arm arm-l" fill="#d9774f"><rect x="0" y="5" width="1" height="2"/></g>
        <g class="arm arm-r" fill="#d9774f"><rect x="11" y="5" width="1" height="2"/></g>
        <g class="body" fill="#d9774f">
          <rect x="3" y="4" width="6" height="1"/>
          <rect x="2" y="5" width="8" height="1"/>
          <rect x="1" y="6" width="10" height="1"/>
          <rect x="2" y="7" width="8" height="1"/>
        </g>
        <g class="legs" fill="#d9774f">
          <rect class="leg leg-l" x="3" y="8" width="2" height="1"/>
          <rect class="leg leg-r" x="7" y="8" width="2" height="1"/>
        </g>
        <g class="eyes" fill="#2b1d16">
          <rect x="3" y="5" width="1" height="1"/>
          <rect x="8" y="5" width="1" height="1"/>
        </g>
      </svg>
    </div>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
